<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: la app ocupa toda la pantalla (notch / barra inferior) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calisthenics Tracker</title>
  <meta name="description" content="Registro y progresión de entrenamientos de calistenia. Funciona sin conexión.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0c">

  <!-- iOS: se comporta como app nativa al añadirla a la pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calistenia">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-bg text-ink antialiased">
  <div id="app" class="app-shell">
    <main id="view" class="view" aria-live="polite"></main>

    <!-- Botón de acción principal (solo en "Entrenar"), al alcance del pulgar -->
    <div id="fab" class="fab hidden">
      <button data-action="picker" class="btn-primary w-full shadow-glow">＋ Añadir ejercicio</button>
    </div>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <div class="nav-brand">Calistenia</div>
      <button data-nav="train"   class="nav-btn" aria-label="Entrenar">
        <svg viewBox="0 0 24 24" class="nav-ico"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        <span>Entrenar</span><kbd class="nav-kbd">1</kbd>
      </button>
      <button data-nav="history" class="nav-btn" aria-label="Historial">
        <svg viewBox="0 0 24 24" class="nav-ico"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Historial</span><kbd class="nav-kbd">2</kbd>
      </button>
      <button data-nav="stats"   class="nav-btn" aria-label="Progreso">
        <svg viewBox="0 0 24 24" class="nav-ico"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>
        <span>Progreso</span><kbd class="nav-kbd">3</kbd>
      </button>
      <div class="nav-foot">
        <button data-action="atajos" class="nav-btn nav-mini"><span>Atajos de teclado</span><kbd class="nav-kbd">?</kbd></button>
        <button data-action="ajustes" class="nav-btn nav-mini"><span>Datos y nube</span></button>
        <p id="nav-nube" class="nav-nube"></p>
      </div>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>

  <noscript><p style="padding:24px">Esta app necesita JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
